                offset="0%"
                stop-color="#bb9af7"
                stop-opacity="0.28"/>

            <stop
                offset="100%"
                stop-color="#bb9af7"
                stop-opacity="0"/>

        </radialGradient>


        <filter id="neon">

            <feGaussianBlur
                stdDeviation="2.5"
                result="blur"/>

            <feMerge>

                <feMergeNode in="blur"/>

                <feMergeNode in="SourceGraphic"/>

            </feMerge>

        </filter>

    </defs>


