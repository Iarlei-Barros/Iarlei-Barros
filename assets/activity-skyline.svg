        <linearGradient
            id="sky"
            x1="0"
            y1="0"
            x2="0"
            y2="1">

            <stop
                offset="0%"
                stop-color="#1a1b26"/>

            <stop
                offset="55%"
                stop-color="#16161e"/>

            <stop
                offset="100%"
                stop-color="#0f111a"/>

        </linearGradient>


        <radialGradient
            id="glow"
            cx="0.45"
            cy="1"
            r="0.7">

